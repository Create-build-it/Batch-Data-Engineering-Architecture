version: "3.8"

networks:
  batch-net:
    driver: bridge

volumes:
  namenode-data:
  datanode-data:
  postgres-data:
  kafka-data:
  zookeeper-data:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - batch-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - batch-net

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: batch-cluster
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - batch-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      SERVICE_PRECONDITION: ""
    ports:
      - "9864:9864"
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - batch-net

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - batch-net

  ingestion-producer:
    build:
      context: ./ingestion
      dockerfile: Dockerfile.producer
    container_name: ingestion-producer
    depends_on:
      - kafka
    volumes:
      - ./ingestion/data:/data:ro
    networks:
      - batch-net

  hdfs-loader:
    build:
      context: ./storage
      dockerfile: Dockerfile.loader
    container_name: hdfs-loader
    depends_on:
      - kafka
      - namenode
      - datanode
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - batch-net

  spark-processor:
    build:
      context: ./processing
      dockerfile: Dockerfile
    container_name: spark-processor
    depends_on:
      - namenode
      - datanode
      - postgres
    networks:
      - batch-net